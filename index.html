<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태주환 소개 페이지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .header {
            background-color: #2b4c7e;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }
        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }
        .content {
            padding: 30px 24px;
        }
        .section {
            margin-bottom: 24px;
        }
        .section h2 {
            font-size: 1.2rem;
            color: #2b4c7e;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }
        .info-list {
            list-style: none;
        }
        .info-list li {
            margin-bottom: 8px;
            display: flex;
        }
        .info-list strong {
            width: 80px;
            color: #495057;
        }
        .footer {
            text-align: center;
            padding: 16px;
            background-color: #f1f3f5;
            color: #868e96;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>태주환</h1>
            <p>경영정보학과 (Management Information Systems)</p>
        </header>

        <main class="content">
            <section class="section">
                <h2>프로필</h2>
                <ul class="info-list">
                    <li><strong>이름</strong> <span>태주환</span></li>
                    <li><strong>전공</strong> <span>경영정보학과</span></li>
                    <li><strong>관심 분야</strong> <span>데이터 분석, IT 비즈니스 전략, 웹 개발</span></li>
                </ul>
            </section>

            <section class="section">
                <h2>자기소개</h2>
                <p>
                    안녕하세요! 경영학적 통찰과 IT 기술을 융합하여 비즈니스 문제를 해결하는 데 관심이 많은 경영정보학과 태주환입니다. 
                    급변하는 디지털 환경 속에서 데이터와 기술을 활용해 더욱 가치 있는 서비스를 만들어가고자 노력하고 있습니다.
                </p>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 태주환. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
